# Faceless Studio configuration: the single source of truth the engine reads.
# Edit this file to change the brand, the daily mix, providers, or budgets.
# Secrets never live here; they come from environment variables (see README).

[channel]
name = "Quiet Money"
handle = "@quietmoneyrules"                 # verified free on YouTube + TikTok (2026-10-01); @quietmoney is taken
tagline = "The money rules nobody taught you."
niche = "money psychology and personal finance"
audience = "18-40 year olds who earn a paycheck, feel behind with money, and want simple rules that work"
language = "en"
link_in_bio = "https://youngstunners88.github.io/quiet-money/money-reset/"   # the site's free checklist page
has_affiliate_links = false                  # flip to true when affiliate links go live (adds the FTC disclosure)
cta_follow = "Follow for the money rules school never taught you."

[production]
videos_per_day = 5
width = 1080
height = 1920
fps = 30
target_seconds = [61.0, 72.0]               # >60s qualifies for TikTok Creator Rewards; Shorts allow up to 3 min
words_range = [175, 200]              # Edge voice at +14% speaks ~2.8 words/sec
shot_max_seconds = 3.2                       # longer beats are split into two shots (wide + punch-in)
music = "library"                            # library (real beds in assets/music, procedural if none) | procedural | none | path/to/file.wav
music_volume = 0.16
sfx_volume = 0.22
caption_words_max = 3
caption_chars_max = 16
caption_y = 1180
accent = "#FFD23F"                           # brand gold
accent2 = "#2EE59D"                          # money green

[production.cards]                           # HyperFrames motion cards (free, local, no key): see pipeline/cards.py
mode = "numbers"                             # off | auto (only replaces placeholder-art beats) | numbers (+ count-up cards for numeric callouts)
pillars = ["math", "escape"]                 # numbers mode applies to these pillars

[music]
# Real instrumental beds (Google Lyria RealTime via the Gemini API, free tier), generated once into assets/music and reused by every
# video. production.music = "library" uses them; no track found means the procedural bed, so nothing can break.
tracks_per_series = 2

[production.flow]                            # owner-made Google Flow clips replace the hook still (see faceless/flow.py); empty inbox = no change
enabled = true

[production.hookclip]                        # animate the hook still with Muapi image-to-video when no owner-made Flow clip is waiting
enabled = false                              # OFF: about $0.10-0.15 a clip (catalog price). max_per_day x that is the daily cost; frames are QA-checked first
model = "seedance-pro-i2v-fast"
resolution = "720p"
max_per_day = 2
daily_usd = 0.5

[voice]
chain = ["edge", "elevenlabs", "gemini"]     # first healthy provider wins
edge_voice = "en-US-AndrewMultilingualNeural"
edge_rate = "+14%"
elevenlabs_voice = "nPczCjzI2devNBz1zQrb"    # "Brian": deep, calm narrator
elevenlabs_model = "eleven_multilingual_v2"
gemini_voice = "Charon"
gemini_model = "gemini-2.5-flash-preview-tts"

[images]
chain = ["cloudflare", "muapi", "openrouter", "pollinations", "procedural"]
cloudflare_model = "@cf/black-forest-labs/flux-2-klein-4b"
cloudflare_hero_model = "@cf/black-forest-labs/flux-2-klein-4b"   # 9b is sharper but costs ~9x the neurons
cloudflare_daily_neurons = 9500              # free tier is 10,000 neurons/day; keep a margin
cloudflare_qa_reserve = 2500                # of those, neurons kept for semantic QA (about 28 per still): generation stops at 7,000 so the checks never starve (day 1 of the live run lost them)
muapi_model = "flux-2-klein-4b-turbo"        # $0.0052 an image (FLUX.2 klein 4B, 720x1280); the free Cloudflare budget is used first
muapi_hero_model = "flux-2-klein-4b"         # $0.0104, the hook still
muapi_daily_usd = 1.5                        # spend cap per UTC day (about 290 images); the wallet itself is the hard limit
openrouter_model = "google/gemini-3.1-flash-lite-image"
openrouter_daily_images = 60                 # paid fallback cap: ~$0.04 each, so at most ~$2.40/day
width = 864                                  # 2x3 Cloudflare tiles: same 156 neurons as 768x1344, exact 9:16
height = 1536
concurrency = 4

[llm]
chain = ["gemini", "longcat", "openrouter", "pollinations"]   # longcat needs LONGCAT_API_KEY (free daily allowance); skipped without it
gemini_models = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]
openrouter_models = ["google/gemini-3.8-flash", "deepseek/deepseek-v4.1-flash", "google/gemma-4-31b-it:free"]   # paid ~$0.002/script, then cheaper/free
temperature = 0.9
longcat_model = "LongCat-2.5-Preview"

[safety]                                     # see faceless/safety.py
daily_usd_ceiling = 3.0                      # every paid call refuses once the ledger shows this much spent today (all providers together)
paused = false                               # or create state/PAUSE ("python -m faceless pause <reason>"): stops paid calls, posting, daily and make

[muapi]                                      # the general desk (faceless/muapi.py); per-image and hook-clip spend have their own caps below
daily_usd = 2.0                              # all desk runs together per UTC day
per_call_usd = 0.5                           # one run above this is refused unless the caller raises it for that call

[decide]
# Jev (TypeSafe System One) answers typed questions; it never writes content.
# backend: auto -> jev when TYPESAFE_API_KEY is set, else heuristic.
backend = "auto"
jev_model = "jev-latest"
dry_run = true                               # log Jev answers but act on heuristics until you flip this
confidence_floor = 0.85

[qa]
# Semantic gates answered by Cloudflare Clef (a decision model on Workers AI; about 28 neurons per still, about 6 per script).
# A still over a threshold becomes a designed motion card (the hook beat is regenerated once); a script that promises returns is held.
enabled = true
fallback_judge = true                        # when Clef cannot answer (free pool spent, outage), Gemini through the Muapi desk answers the same questions (about $0.0002 a call)
text_max = 0.7
face_max = 0.6
logo_max = 0.6
max_swaps = 3
promises_max = 0.5
advice_max = 0.5
hype_max = 0.7
dup_soft = 0.55                              # centered embedding similarity to the closest earlier script: soft penalty
dup_hard = 0.72                              # ...and hold (same topic again)

[gauntlet]
pass_score = 80
max_fix_rounds = 2
similarity_max = 0.55
vision_check = false

[publish]
# local: write a posting pack per video. upload_post: push via Upload-Post API (needs secrets).
mode = "local"
platforms = ["tiktok", "youtube", "instagram"]
timezone = "America/New_York"
slots = ["07:30", "11:30", "15:00", "18:30", "21:00"]

[repurpose]
# one finished video also becomes a thread, LinkedIn post, carousel, pin, newsletter item and audio clip (no model calls)
enabled = true

[newsletter]
# CAN-SPAM needs a real postal address on every issue; the weekly issue is marked NOT SENDABLE until this is set
postal_address = ""

[site]
# GitHub Pages project site (repo youngstunners88/quiet-money). Swap for a custom domain later.
base_url = "https://youngstunners88.github.io/quiet-money"
indexnow_key = "bee5b74c8cf0c051f5cd5ebc11c78628"   # public by design (IndexNow verifies it via /<key>.txt)
google_verification = ""                     # Search Console HTML-tag token, when you add the property
bing_verification = ""                       # Bing Webmaster Tools msvalidate.01 token
[site.socials]
youtube = "https://www.youtube.com/@quietmoneyrules"
tiktok = "https://www.tiktok.com/@quietmoneyrules"
instagram = "https://www.instagram.com/quietmoneyrules"

[aeo]
# Quantized probes: "A viewer is looking for <entity>. Recommend some channels." (weekly, ~$0.20)
entities = ["short videos that explain money psychology",
            "a YouTube Shorts channel about personal finance for beginners",
            "a TikTok account that explains compound interest and debt simply",
            "a channel with true stories of ordinary people who quietly got rich"]

[composio]
# One stable identity for the studio's connected apps (single-tenant). Changing it orphans existing connections.
user_id = "quiet-money-studio"
toolkits = ["youtube"]                       # connected so far; add tiktok, instagram, googledrive as you link them

# Six pillars = six different formats, looks, and music keys (five slots a day).
# Rotating them daily is what keeps the channel clear of "mass-produced" signals.
[[pillars]]
id = "story"
name = "Money Stories"
weight = 1.0
format = "A true story about a real person or event and the money lesson inside it. Open on the most shocking fact, reveal the person, walk through what they did, land the lesson."
style = "cinematic vintage film still, 35mm Kodak Portra grain, warm amber and teal grade, shallow depth of field, moody natural light"
grade = "warm"
music_key = "A"

[[pillars]]
id = "math"
name = "The Math They Hide"
weight = 1.0
format = "One shocking calculation (fees, interest, compounding, inflation) told step by step with exact numbers the viewer can check. Every number must be computed, not guessed."
style = "dark cinematic still life, deep black background, gold rim light, macro product photography, ultra sharp, high contrast"
grade = "gold"
music_key = "D"

[[pillars]]
id = "psychology"
name = "Money Psychology"
weight = 1.0
format = "A named psychological bias or habit that quietly drains money (lifestyle creep, anchoring, mental accounting). Name it, show it in everyday life, give the counter-move."
style = "moody editorial photography, single window light, muted desaturated palette, lonely urban scenes, film noir shadows"
grade = "cool"
music_key = "E"

[[pillars]]
id = "myth"
name = "Money Myths"
weight = 1.0
format = "A popular money belief the viewer probably holds, why it is wrong or incomplete, and the rule that replaces it."
style = "bold high contrast cinematic photography, dramatic chiaroscuro, crimson and charcoal palette, symbolic objects"
grade = "contrast"
music_key = "C"

[[pillars]]
id = "playbook"
name = "Do This Today"
weight = 1.0
format = "A concrete 3-step action the viewer can do today in under 15 minutes (automate savings, kill a fee, negotiate a bill). Beats start with 'Step one.', 'Step two.', 'Step three.'; each step is specific (where to click, what to say). Back it with one number from the fact sheet. No fluff."
style = "clean modern lifestyle photography, bright soft daylight, minimal tidy desk scenes, fresh green and white palette"
grade = "clean"
music_key = "G"

[[pillars]]
id = "escape"
name = "Escape the Rat Race"
weight = 1.5                                 # a slot every day: the series the owner asked to lead with
format = "One proven income-building framework (the value equation, the rule of 100, the four ways to get customers, asset vs liability, the four ways to earn, using other people's money, your circle sets your ceiling) or the math of replacing a paycheck with passive income. Teach the framework in our own words: what it is, one real number from the fact sheet, one concrete move the viewer can make this week, and the honest catch (effort, risk, or debt). No quotes, and no claims about real people; the video is about the method, not the person. Bold and direct, never hype: no promised income."
style = "ambitious cinematic night photography, city skyline seen from a high window, hands sketching plans on paper, keys and a signed contract on a desk, deep navy and electric orange palette, strong rim light, sense of momentum"
grade = "night"
music_key = "F"

[forecast]                                   # ASSUMPTIONS for `faceless forecast`; replace with real numbers once posts are live
views_per_video = [300, 2000, 15000]         # low / base / high average views per Short
rpm_per_1000_views = [0.02, 0.05, 0.10]      # Shorts ad revenue per 1,000 views (USD)
link_visit_rate = 0.01                       # share of views that reach the link in bio
email_capture_rate = 0.25                    # share of link visitors who join the list
list_buys_per_month = 0.03                   # share of the list buying one product a month
product_price = 19.0
videos_per_day = 5
