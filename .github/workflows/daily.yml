name: Daily batch

# OPTIONAL runner. The daily batch normally runs as a scheduled Claude Code routine that uses the keys
# already stored in the Claude Code environment, so no API keys live on GitHub (see README "Where the
# keys live"). This workflow is manual-only; it needs the keys as Actions secrets if you ever use it.
# To make it the scheduler instead, add back:  schedule: [{cron: "17 9 * * *"}]
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Videos to produce"
        default: "5"
      publish:
        description: "Schedule posts (true) or only build packs (false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install engine
        run: pip install --use-pep517 pysher && pip install -r requirements.txt
      - name: Check secrets
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY$OPENROUTER_API_KEY" ] || [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Daily batch skipped::Add GEMINI_API_KEY (or OPENROUTER_API_KEY), CLOUDFLARE_API_KEY and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Doctor
        if: steps.keys.outputs.ready == 'true'
        run: python -m faceless doctor
      - name: Restore image cache
        if: steps.keys.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: production/cache
          key: faceless-cache-${{ github.run_id }}
          restore-keys: faceless-cache-
      - name: Produce batch
        if: steps.keys.outputs.ready == 'true'
        env:   # inputs go through env, never ${{ }} inside the script, so they can't inject shell
          COUNT: ${{ github.event.inputs.count || '5' }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "::error::count must be a number"; exit 1;; esac
          ARGS=(--count "$COUNT")
          if [ "$PUBLISH" != "true" ]; then ARGS+=(--no-publish); fi
          if [ -n "$UPLOAD_POST_API_KEY" ]; then sed -i 's/^mode = "local"/mode = "upload_post"/' studio.toml; fi
          python -m faceless daily "${ARGS[@]}"
      - name: Upload posting packs
        if: always() && steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: posting-packs-${{ github.run_number }}
          path: distribution/queue/
          retention-days: 14
      - name: Commit state and reports
        if: always() && steps.keys.outputs.ready == 'true'
        run: |
          git checkout -- studio.toml
          git config user.name "quiet-money-bot"
          git config user.email "quiet-money-bot@users.noreply.github.com"
          git add state script-lab gauntlet analytics distribution/queue || true
          git diff --cached --quiet || git commit -m "studio: daily batch $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
