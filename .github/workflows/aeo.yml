name: AEO probe

# Weekly answer-engine visibility probe: are ChatGPT/Claude/Gemini/Perplexity recommending or citing us?
on:
  schedule:
    - cron: "41 13 * * 1"       # Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r <(grep -vE "composio|edge-tts|opencv" requirements.txt)
      - run: python -m faceless aeo
      - name: Commit results
        run: |
          git config user.name "quiet-money-bot"
          git config user.email "quiet-money-bot@users.noreply.github.com"
          git add analytics/aeo.jsonl state/ledger.jsonl state/journal.jsonl
          git diff --cached --quiet || git commit -m "analytics: weekly AEO probe $(date -u +%F)"
          git pull --rebase --autostash origin main && git push origin HEAD:main
