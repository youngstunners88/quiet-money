name: Outbound hunt

# OPTIONAL runner for the service desk's daily client hunt (faceless/outbound.py). The hunt normally runs as a
# scheduled Claude Code routine that uses the keys already in the Claude Code environment, so no API keys live on
# GitHub (see README "Where the keys live"). This workflow is manual-only; it needs OPENROUTER_API_KEY as an Actions
# secret if you ever use it. To make it the scheduler instead, add back:  schedule: [{cron: "41 7 * * *"}]
#
# Firecrawl renders the pages plain HTTP cannot (an X profile is a JS shell), capped in pages per day by
# [outbound].firecrawl_pages_per_day and recorded in the ledger.
#
# It sends nothing. The loop researches, scores, drafts and gates; the owner sends. The lead cards and drafts are
# gitignored, so this runner commits only the privacy-safe memory (hashed project index and outcome log) and uploads
# the batch report as an artifact for the owner to read.
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Projects to screen"
        default: "40"
      packages:
        description: "Outreach packages to queue"
        default: "8"

permissions:
  contents: write

concurrency:
  group: outbound
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FIRECRAWL: ${{ secrets.FIRECRAWL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Run the hunt
        env:
          CANDIDATES: ${{ inputs.candidates }}
          PACKAGES: ${{ inputs.packages }}
        run: python -m faceless outbound run --candidates "$CANDIDATES" --packages "$PACKAGES"
      - name: Upload the batch report and the packages for the owner
        uses: actions/upload-artifact@v4
        with:
          name: outbound-batch
          path: |
            channel/services/web3-video/reviews/
            channel/services/web3-video/outbound/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit the privacy-safe memory only
        run: |
          git config user.name "quiet-money-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/outbound-seen.json state/outbound-outcomes.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "outbound: hashed project memory after the daily hunt"
          git push || echo "nothing to push"
