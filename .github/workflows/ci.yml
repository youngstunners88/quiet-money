name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}      # on main every commit is its own group, so none is skipped or cancelled
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}                       # branches and pull requests supersede themselves

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System tools (ffmpeg renders the smoke-test video, poppler reads PDFs)
        timeout-minutes: 9                       # a stalled step hung whole jobs (PR #42, #45, #47): each attempt is bounded and retried once instead
        run: |
          sudo rm -f /var/lib/man-db/auto-update   # man-db re-indexes every manual page after each install; on Ubuntu 24.04 runners that alone can take minutes
          for attempt in 1 2; do
            sudo timeout 200 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq &&
            sudo timeout 200 apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg poppler-utils && break
          done
          command -v ffmpeg && command -v pdftoppm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --use-pep517 pysher && pip install -r requirements.txt
      - name: Unit tests, failure drills and the render smoke test
        run: python -m pytest -q tests
      - name: Skills lint clean (the scheduled routines follow these files)
        run: python -m faceless skills
      - name: Import every module
        run: python -c "import faceless.cli, faceless.orchestrator, faceless.site, faceless.aeo, faceless.brand, faceless.muapi, faceless.preflight, faceless.watchdog, faceless.shop, faceless.listing, faceless.offer, faceless.distribute, faceless.pipeline.sketch"
      - name: Site builds
        run: python -m faceless site build
