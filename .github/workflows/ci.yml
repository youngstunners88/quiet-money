name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --use-pep517 pysher && pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Import every module
        run: python -c "import faceless.cli, faceless.orchestrator, faceless.site, faceless.aeo, faceless.brand"
      - name: Site builds
        run: python -m faceless site build
